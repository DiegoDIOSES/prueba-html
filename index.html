<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backlog CRM — Sokso</title>
<style>
  :root {
    --navy: #1F3A5F;
    --navy-dark: #16283F;
    --bg: #F3F5F8;
    --surface: #FFFFFF;
    --ink: #1D2433;
    --ink-soft: #5B6472;
    --line: #DFE3E8;
    --line-soft: #EEF1F4;

    --alta-bg: #F4CFC9; --alta-fg: #8C2F27;
    --media-bg: #F6DFAE; --media-fg: #7A5417;
    --baja-bg: #C7E3C2; --baja-fg: #2F5233;

    --porhacer-bg: #E5E8EC; --porhacer-fg: #4A5568;
    --progreso-bg: #C6DBEC; --progreso-fg: #1F4E78;
    --revision-bg: #F5DFB4; --revision-fg: #8A5A19;
    --bloqueado-bg: #F2C2BC; --bloqueado-fg: #8C2F27;
    --hecho-bg: #C3E1BE; --hecho-fg: #2F5233;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  .wrap { max-width: 1400px; margin: 0 auto; padding: 28px 28px 60px; }

  header.banner {
    background: linear-gradient(135deg, var(--navy), var(--navy-dark));
    border-radius: 10px;
    padding: 26px 32px;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 22px;
  }

  header.banner h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 30px;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }

  header.banner .team {
    font-size: 13px;
    color: #C9D6E4;
  }

  .kpis {
    display: flex;
    gap: 10px;
  }

  .kpi {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 8px 16px;
    text-align: center;
    min-width: 84px;
  }
  .kpi .num { font-size: 20px; font-weight: 600; line-height: 1.1; }
  .kpi .lbl { font-size: 10.5px; color: #C9D6E4; margin-top: 2px; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
  }

  .toolbar select, .toolbar input[type="text"] {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
    color: var(--ink);
    background: #fff;
    font-family: inherit;
  }

  .toolbar input[type="text"] { min-width: 200px; }

  .spacer { flex: 1; }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    padding: 9px 16px;
    transition: background 0.15s ease;
  }

  .btn-primary {
    background: var(--navy);
    color: #fff;
    font-weight: 600;
  }
  .btn-primary:hover { background: var(--navy-dark); }

  .btn-ghost {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
  }
  .btn-ghost:hover { background: var(--line-soft); }

  .table-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }

  table { width: 100%; border-collapse: collapse; }

  thead th {
    background: var(--navy);
    color: #fff;
    text-align: left;
    padding: 10px 12px;
    font-size: 11.5px;
    font-weight: 600;
    position: sticky;
    top: 0;
    white-space: nowrap;
  }

  tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line-soft);
    vertical-align: top;
    font-size: 13px;
  }

  tbody tr:nth-child(even) { background: #FAFBFC; }
  tbody tr:hover { background: #F0F4F8; }

  .task-name { font-weight: 600; color: var(--ink); }
  .task-desc { color: var(--ink-soft); font-size: 12px; margin-top: 2px; max-width: 260px; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
  }

  .row-actions { display: flex; gap: 6px; }
  .row-actions button {
    padding: 5px 9px;
    font-size: 12px;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty-state .big { font-size: 15px; color: var(--ink); margin-bottom: 6px; font-weight: 600; }

  .overdue { color: var(--alta-fg); font-weight: 600; }

  /* Modal */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(20, 28, 40, 0.45);
    align-items: center; justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .overlay.open { display: flex; }

  .modal {
    background: #fff;
    border-radius: 10px;
    width: 100%;
    max-width: 640px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 26px 28px 22px;
  }

  .modal h2 {
    font-family: Georgia, serif;
    font-weight: 400;
    font-size: 20px;
    margin: 0 0 18px;
    color: var(--navy);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 14px;
  }
  .form-grid .full { grid-column: 1 / -1; }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  .field input, .field select, .field textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
  }

  .field textarea { resize: vertical; min-height: 54px; }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
    border-top: 1px solid var(--line-soft);
    padding-top: 16px;
  }

  .saved-note {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 10px;
    text-align: right;
  }

  @media (max-width: 760px) {
    .wrap { padding: 16px; }
    header.banner { flex-direction: column; align-items: flex-start; }
    .form-grid { grid-template-columns: 1fr; }
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tbody tr {
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 10px;
      padding: 10px;
    }
    tbody td {
      border: none;
      padding: 4px 2px;
    }
    tbody td::before {
      content: attr(data-label);
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="banner">
    <div>
      <h1>Backlog CRM — Sokso</h1>
      <div class="team">Equipo: Diego · Edith · Paula</div>
    </div>
    <div class="kpis" id="kpis"></div>
  </header>

  <div class="toolbar">
    <select id="filterResponsable">
      <option value="">Responsable: todos</option>
      <option value="Diego">Diego</option>
      <option value="Edith">Edith</option>
      <option value="Paula">Paula</option>
    </select>
    <select id="filterEstado">
      <option value="">Estado: todos</option>
      <option value="Por hacer">Por hacer</option>
      <option value="En progreso">En progreso</option>
      <option value="En revisión">En revisión</option>
      <option value="Bloqueado">Bloqueado</option>
      <option value="Hecho">Hecho</option>
    </select>
    <select id="filterPrioridad">
      <option value="">Prioridad: todas</option>
      <option value="Alta">Alta</option>
      <option value="Media">Media</option>
      <option value="Baja">Baja</option>
    </select>
    <input type="text" id="searchBox" placeholder="Buscar tarea o descripción...">
    <div class="spacer"></div>
    <button class="btn-ghost" id="clearFilters">Limpiar filtros</button>
    <button class="btn-primary" id="openAdd">+ Agregar tarea</button>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Tarea</th>
          <th>Módulo</th>
          <th>Tipo</th>
          <th>Responsable</th>
          <th>Prioridad</th>
          <th>Estado</th>
          <th>Límite</th>
          <th>Horas (est/real)</th>
          <th>Comentarios</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="big">Todavía no hay tareas</div>
      <div>Agrega la primera actividad del backlog con "+ Agregar tarea".</div>
    </div>
  </div>

  <div class="saved-note" id="savedNote"></div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Nueva tarea</h2>
    <form id="taskForm">
      <div class="form-grid">
        <div class="field full">
          <label>Tarea</label>
          <input type="text" id="f_tarea" required>
        </div>
        <div class="field full">
          <label>Descripción</label>
          <textarea id="f_desc"></textarea>
        </div>
        <div class="field">
          <label>Módulo / Área</label>
          <select id="f_modulo">
            <optgroup label="Visual">
              <option>Inicio usuarios</option>
              <option>Campaña Recuperación</option>
              <option>Lista de Estrellas- Recuperación</option>
              <option>Nuevo_Perfil</option>
              <option>MI AGENDA</option>
              <option>RANKING GENERAL</option>
              <option>Estrellas-Directoras</option>
              <option>RESUMEN POR REGION</option>
              <option>DETALLE DE DIRECTORAS</option>
              <option>PANEL DIRECTORAS</option>
              <option>Detalle de Leads</option>
              <option>Tareas</option>
              <option>Tareas detalles</option>
              <option>Lista Leads</option>
              <option>Lista Estrellas</option>
              <option>Detalle de estrellas</option>
              <option>Perfil</option>
              <option>Formulario</option>
            </optgroup>
            <optgroup label="Tablas">
              <option>Usuarios Directoras</option>
              <option>Leads</option>
              <option>Estrellas</option>
              <option>Tipos Tarea</option>
              <option>Tareas</option>
              <option>Eventos</option>
              <option>HISTORIAL ESTRELLAS</option>
              <option>AGENDA GERENTES DE NEGOCIO</option>
              <option>CAMPAÑA DE RECUPERACIÓN</option>
              <option>Historial de recuperación</option>
            </optgroup>
          </select>
        </div>
        <div class="field">
          <label>Tipo de tarea</label>
          <select id="f_tipo">
            <option>Bug</option>
            <option>Mejora</option>
            <option>Nueva funcionalidad</option>
            <option>Consulta / Soporte</option>
            <option>Reunión</option>
          </select>
        </div>
        <div class="field">
          <label>Responsable</label>
          <select id="f_resp">
            <option>Diego</option>
            <option>Edith</option>
            <option>Paula</option>
          </select>
        </div>
        <div class="field">
          <label>Prioridad</label>
          <select id="f_prior">
            <option>Alta</option>
            <option>Media</option>
            <option>Baja</option>
          </select>
        </div>
        <div class="field">
          <label>Estado</label>
          <select id="f_estado">
            <option>Por hacer</option>
            <option>En progreso</option>
            <option>En revisión</option>
            <option>Bloqueado</option>
            <option>Hecho</option>
          </select>
        </div>
        <div class="field">
          <label>Sprint / Semana</label>
          <input type="text" id="f_sprint" placeholder="Sem 37">
        </div>
        <div class="field">
          <label>Fecha de solicitud</label>
          <input type="date" id="f_fsolicitud">
        </div>
        <div class="field">
          <label>Fecha límite</label>
          <input type="date" id="f_flimite">
        </div>
        <div class="field">
          <label>Horas estimadas</label>
          <input type="number" id="f_hest" min="0" step="0.5">
        </div>
        <div class="field">
          <label>Horas reales</label>
          <input type="number" id="f_hreal" min="0" step="0.5">
        </div>
        <div class="field full">
          <label>Comentarios / Bloqueos</label>
          <textarea id="f_comentarios"></textarea>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn-primary" id="saveBtn">Guardar tarea</button>
      </div>
    </form>
  </div>
</div>

<script>
const STORAGE_KEY = 'backlog-crm-tasks';
let tasks = [];
let editingId = null;

const overlay = document.getElementById('overlay');
const form = document.getElementById('taskForm');
const savedNote = document.getElementById('savedNote');

function badgeClass(kind, value) {
  const map = {
    prioridad: { 'Alta': ['alta-bg','alta-fg'], 'Media': ['media-bg','media-fg'], 'Baja': ['baja-bg','baja-fg'] },
    estado: {
      'Por hacer': ['porhacer-bg','porhacer-fg'],
      'En progreso': ['progreso-bg','progreso-fg'],
      'En revisión': ['revision-bg','revision-fg'],
      'Bloqueado': ['bloqueado-bg','bloqueado-fg'],
      'Hecho': ['hecho-bg','hecho-fg'],
    }
  };
  const pair = (map[kind] && map[kind][value]) || ['porhacer-bg','porhacer-fg'];
  return `background: var(--${pair[0]}); color: var(--${pair[1]});`;
}

function fmtDate(d) {
  if (!d) return '—';
  const parts = d.split('-');
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

function isOverdue(t) {
  if (!t.flimite || t.estado === 'Hecho') return false;
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(t.flimite + 'T00:00:00');
  const diff = (due - today) / 86400000;
  return diff <= 2;
}

async function loadTasks() {
  try {
    const result = await window.storage.get(STORAGE_KEY, true);
    tasks = result && result.value ? JSON.parse(result.value) : [];
  } catch (e) {
    tasks = [];
  }
  render();
}

async function saveTasks() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(tasks), true);
    savedNote.textContent = 'Guardado · visible para todo el equipo';
    setTimeout(() => { savedNote.textContent = ''; }, 2500);
  } catch (e) {
    savedNote.textContent = 'No se pudo guardar. Intenta de nuevo.';
  }
}

function getFilters() {
  return {
    resp: document.getElementById('filterResponsable').value,
    estado: document.getElementById('filterEstado').value,
    prior: document.getElementById('filterPrioridad').value,
    search: document.getElementById('searchBox').value.trim().toLowerCase(),
  };
}

function filteredTasks() {
  const f = getFilters();
  return tasks.filter(t => {
    if (f.resp && t.responsable !== f.resp) return false;
    if (f.estado && t.estado !== f.estado) return false;
    if (f.prior && t.prioridad !== f.prior) return false;
    if (f.search) {
      const hay = (t.tarea + ' ' + t.desc).toLowerCase();
      if (!hay.includes(f.search)) return false;
    }
    return true;
  });
}

function renderKPIs() {
  const total = tasks.length;
  const hecho = tasks.filter(t => t.estado === 'Hecho').length;
  const progreso = tasks.filter(t => t.estado === 'En progreso').length;
  const bloqueado = tasks.filter(t => t.estado === 'Bloqueado').length;
  const pct = total ? Math.round((hecho / total) * 100) : 0;

  const kpis = [
    ['Total', total],
    ['Hechas', hecho],
    ['En progreso', progreso],
    ['Bloqueadas', bloqueado],
    ['% Avance', pct + '%'],
  ];
  document.getElementById('kpis').innerHTML = kpis.map(([lbl, num]) =>
    `<div class="kpi"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>`
  ).join('');
}

function render() {
  renderKPIs();
  const list = filteredTasks();
  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');

  if (list.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  tbody.innerHTML = list.map(t => `
    <tr>
      <td data-label="Tarea">
        <div class="task-name">${escapeHtml(t.tarea)}</div>
        ${t.desc ? `<div class="task-desc">${escapeHtml(t.desc)}</div>` : ''}
      </td>
      <td data-label="Módulo">${escapeHtml(t.modulo || '—')}</td>
      <td data-label="Tipo">${escapeHtml(t.tipo || '—')}</td>
      <td data-label="Responsable">${escapeHtml(t.responsable || '—')}</td>
      <td data-label="Prioridad"><span class="badge" style="${badgeClass('prioridad', t.prioridad)}">${t.prioridad || '—'}</span></td>
      <td data-label="Estado"><span class="badge" style="${badgeClass('estado', t.estado)}">${t.estado || '—'}</span></td>
      <td data-label="Límite" class="${isOverdue(t) ? 'overdue' : ''}">${fmtDate(t.flimite)}</td>
      <td data-label="Horas">${t.hest || 0} / ${t.hreal || 0}</td>
      <td data-label="Comentarios">${escapeHtml(t.comentarios || '—')}</td>
      <td data-label="">
        <div class="row-actions">
          <button class="btn-ghost" onclick="editTask('${t.id}')">Editar</button>
          <button class="btn-ghost" onclick="deleteTask('${t.id}')">Eliminar</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function openModal(task) {
  editingId = task ? task.id : null;
  document.getElementById('modalTitle').textContent = task ? 'Editar tarea' : 'Nueva tarea';
  document.getElementById('f_tarea').value = task ? task.tarea : '';
  document.getElementById('f_desc').value = task ? task.desc : '';
  document.getElementById('f_modulo').value = task ? task.modulo : 'CRM Softr';
  document.getElementById('f_tipo').value = task ? task.tipo : 'Mejora';
  document.getElementById('f_resp').value = task ? task.responsable : 'Diego';
  document.getElementById('f_prior').value = task ? task.prioridad : 'Media';
  document.getElementById('f_estado').value = task ? task.estado : 'Por hacer';
  document.getElementById('f_sprint').value = task ? task.sprint : '';
  document.getElementById('f_fsolicitud').value = task ? task.fsolicitud : '';
  document.getElementById('f_flimite').value = task ? task.flimite : '';
  document.getElementById('f_hest').value = task ? task.hest : '';
  document.getElementById('f_hreal').value = task ? task.hreal : '';
  document.getElementById('f_comentarios').value = task ? task.comentarios : '';
  overlay.classList.add('open');
}

function closeModal() {
  overlay.classList.remove('open');
  form.reset();
  editingId = null;
}

window.editTask = function(id) {
  const t = tasks.find(x => x.id === id);
  if (t) openModal(t);
};

window.deleteTask = function(id) {
  if (!confirm('¿Eliminar esta tarea?')) return;
  tasks = tasks.filter(x => x.id !== id);
  saveTasks();
  render();
};

document.getElementById('openAdd').addEventListener('click', () => openModal(null));
document.getElementById('cancelBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const data = {
    id: editingId || ('t' + Date.now()),
    tarea: document.getElementById('f_tarea').value.trim(),
    desc: document.getElementById('f_desc').value.trim(),
    modulo: document.getElementById('f_modulo').value,
    tipo: document.getElementById('f_tipo').value,
    responsable: document.getElementById('f_resp').value,
    prioridad: document.getElementById('f_prior').value,
    estado: document.getElementById('f_estado').value,
    sprint: document.getElementById('f_sprint').value.trim(),
    fsolicitud: document.getElementById('f_fsolicitud').value,
    flimite: document.getElementById('f_flimite').value,
    hest: parseFloat(document.getElementById('f_hest').value) || 0,
    hreal: parseFloat(document.getElementById('f_hreal').value) || 0,
    comentarios: document.getElementById('f_comentarios').value.trim(),
  };
  if (!data.tarea) return;

  if (editingId) {
    tasks = tasks.map(t => t.id === editingId ? data : t);
  } else {
    tasks.push(data);
  }
  saveTasks();
  render();
  closeModal();
});

['filterResponsable','filterEstado','filterPrioridad','searchBox'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
});
document.getElementById('clearFilters').addEventListener('click', () => {
  document.getElementById('filterResponsable').value = '';
  document.getElementById('filterEstado').value = '';
  document.getElementById('filterPrioridad').value = '';
  document.getElementById('searchBox').value = '';
  render();
});

loadTasks();
</script>

</body>
</html>
